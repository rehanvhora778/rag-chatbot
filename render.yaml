# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Import this file from the Render dashboard ("New +" -> "Blueprint") and it
# creates the backend web service with the settings below. Secrets are marked
# `sync: false`, so Render prompts for them instead of reading them from git.
#
# This describes the UPGRADED stack: PostgreSQL + pgvector, hybrid retrieval,
# vectors and full-text search in the database. See DEPLOYMENT.md for the
# step-by-step, and for what the free tier does and does not give you.
#
# Two pieces are deliberately NOT declared here:
#
#   The database. Render's free PostgreSQL is deleted after 30 days, which is
#   fine for a demo and fatal for a link on a CV. DATABASE_URL is a secret you
#   paste from Neon (free permanently, pgvector available) instead.
#
#   A Celery worker. Render background workers are paid-only. Without one,
#   `apps.documents.services.queue_processing` pings for a live worker, finds
#   none, and ingests in a daemon thread — the path this project has always
#   had. It logs which path it took, so a threaded ingest is never a silent
#   surprise. Add the worker below when there is a budget for it.
#
# The React frontend is NOT here — it is deployed separately to Vercel
# (see DEPLOYMENT.md).

services:
  - type: web
    # Name and region must match the existing service exactly — Render cannot
    # rename or move a service through a Blueprint, and a mismatch makes the
    # sync fail without applying anything.
    name: rag-chatbot-backend
    runtime: python
    plan: free
    region: oregon             # also: singapore, frankfurt
    rootDir: backend
    # `bash ./build.sh`, not `./build.sh` — git on Windows does not preserve the
    # executable bit, so calling bash directly avoids a "permission denied" build.
    buildCommand: "bash ./build.sh"

    # 1 worker: the free instance has 512 MB RAM and each worker loads its own
    #   copy of the embedding model.
    # 4 threads: ingestion runs in background threads (no Celery worker on the
    #   free plan), and answers stream over SSE holding a thread for the
    #   duration, so the server must stay responsive while both are happening.
    # 180s timeout: a long RAG answer plus a slow Groq call can exceed the
    #   default 30s and would otherwise be killed mid-request.
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 180"

    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ── Secrets: Render asks for these on first deploy ──────────

      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value

      # PostgreSQL 16 + pgvector, from Neon: https://console.neon.tech
      # Use the POOLED connection string (the host contains `-pooler`) and keep
      # the `?sslmode=require` Neon puts on the end. Neon suspends an idle
      # compute after five minutes; `conn_health_checks` is already on in
      # settings, so Django notices a connection that died in the meantime and
      # reconnects instead of raising on the first query after a quiet period.
      - key: DATABASE_URL
        sync: false

      - key: GROQ_API_KEY
        sync: false

      # The Vercel origin, e.g. https://rayhan-rag-chatbot.vercel.app
      # Scheme included, no trailing slash, comma-separated for several.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

      # Free instances have no outbound SMTP, so leave these blank and Django
      # prints the OTP into the service log instead. BREVO_API_KEY sends over
      # HTTPS and takes precedence when set — that is the one that works here.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false

      # ── Persistence: the upgraded stack ─────────────────────────
      #
      # settings/base.py already derives all three of these from DATABASE_URL
      # being set. They are written out anyway because a Blueprint is also
      # documentation: someone reading the dashboard should be able to see
      # which stack is live without deriving it from the absence of a variable.

      - key: PERSISTENCE_BACKEND
        value: postgres
      - key: VECTOR_BACKEND
        value: pgvector

      # ── Retrieval ───────────────────────────────────────────────

      # Dense + PostgreSQL full-text, fused by Reciprocal Rank Fusion. This is
      # the reason for the whole migration: an embedding cannot retrieve
      # "Revision 7.2", and full-text cannot tell that "refund window" and
      # "return period" are the same question.
      - key: RAG_HYBRID_ENABLED
        value: "True"

      # 4, not the 3 the measured table uses. Cutting k to 3 is only safe with
      # the cross-encoder in front of it — without reranking, recall drops
      # because a correct passage falls off the end.
      - key: RAG_TOP_K
        value: "4"

      # Must stay false on the free plan. The cross-encoder needs the PyTorch
      # stack, which requirements-prod.txt excludes at ~520 MB — more than this
      # instance has RAM in total. The pipeline keeps fusion order and says so
      # in the log rather than failing.
      - key: RAG_RERANK_ENABLED
        value: "False"

      # One extra Groq call per follow-up question. Off because the free Groq
      # tier rate-limits at roughly a hundred calls and a rate-limited rewrite
      # would cost an answer, not just a rewrite.
      - key: RAG_QUERY_REWRITE
        value: "False"

      # ── Background processing ───────────────────────────────────
      #
      # No Redis and no worker on this plan. CELERY_BROKER_URL therefore points
      # at the default localhost:6379, where nothing is listening — the probe
      # in queue_processing gets an immediate connection refusal (cheap, not a
      # timeout) and takes the thread path. Setting a real broker URL with no
      # worker attached would be worse than this: tasks would dispatch into a
      # queue nothing consumes and documents would sit at "pending" for ever.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: CACHE_ENABLED
        value: "False"             # locmem; one worker, so nothing to share

      # ── Fixed production settings ───────────────────────────────

      - key: DEBUG
        value: "False"

      # settings/base.py appends RENDER_EXTERNAL_HOSTNAME automatically, so
      # this is belt-and-braces: production.py refuses to start when
      # ALLOWED_HOSTS is still just the localhost default, and relying on an
      # injected variable to clear that check is a fragile way to boot.
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

      - key: EMBEDDING_BACKEND
        value: onnx                  # torch is not installed in production
      - key: EMBEDDING_ONNX_PROVIDER
        value: cpu                   # no GPU on Render

      # Must stay false here. With the preload on, the ONNX session is built in
      # a short-lived background thread at startup and then run() is called from
      # the upload thread, which deadlocks: uploads sit at "processing" forever,
      # with no exception, no error log and no failed status. Even a one-chunk
      # document never returns. Loading the model lazily means the session is
      # created and used on the same thread. Cost is ~20s on the first upload
      # after a restart, while it loads.
      - key: EMBEDDING_PRELOAD
        value: "false"

      # Pinned because Groq retires models without notice, and the failure is
      # quiet: llama-3.3-70b-versatile started returning 404 model_not_found,
      # which broke chat answers and left summaries reading "Summary could not
      # be generated." Check https://console.groq.com/docs/models if answers
      # start failing again.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: DEFAULT_FROM_EMAIL
        value: RAG Chatbot <no-reply@localhost>

# ══════════════════════════════════════════════════════════════════
# Adding a real Celery worker (paid)
# ══════════════════════════════════════════════════════════════════
#
# The thread fallback loses a job if the instance restarts mid-ingest. To make
# ingestion durable, uncomment the two blocks below and add REDIS_URL to the
# web service's environment, pointing at the same Key Value instance. Both are
# paid: a background worker has no free plan, and the free Key Value instance
# is 25 MB with no persistence.
#
# With a worker attached, `acks_late` and `reject_on_worker_lost` redeliver a
# job whose worker died — safe only because ingestion is idempotent, which
# tests/test_ingestion_tasks.py asserts directly.
#
#   - type: keyvalue
#     name: rag-chatbot-redis
#     plan: free
#     region: oregon
#     maxmemoryPolicy: noeviction     # a broker must not drop queued tasks
#     ipAllowList: []                 # private network only
#
#   - type: worker
#     name: rag-chatbot-worker
#     runtime: python
#     plan: starter
#     region: oregon
#     rootDir: backend
#     buildCommand: "bash ./build.sh"
#     startCommand: "celery -A config worker --loglevel=info --concurrency=1"
#     envVars:
#       - fromGroup: rag-chatbot-shared    # or repeat the web service's vars
#       - key: REDIS_URL
#         fromService:
#           name: rag-chatbot-redis
#           type: keyvalue
#           property: connectionString
