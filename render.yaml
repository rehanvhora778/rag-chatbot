# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Import this file from the Render dashboard ("New +" -> "Blueprint") and it
# creates the backend web service with the settings below. Secrets are marked
# `sync: false`, so Render prompts for them instead of reading them from git.
#
# The React frontend is NOT here — it is deployed separately to Vercel
# (see DEPLOYMENT.md).

services:
  - type: web
    # Name and region must match the existing service exactly — Render cannot
    # rename or move a service through a Blueprint, and a mismatch makes the
    # sync fail without applying anything.
    name: rag-chatbot-backend
    runtime: python
    plan: free
    region: oregon             # also: singapore, frankfurt
    rootDir: backend
    # `bash ./build.sh`, not `./build.sh` — git on Windows does not preserve the
    # executable bit, so calling bash directly avoids a "permission denied" build.
    buildCommand: "bash ./build.sh"

    # 1 worker: the free instance has 512 MB RAM and each worker loads its own
    #   copy of the embedding model.
    # 4 threads: uploads are processed in background threads, so the server must
    #   stay responsive while one is running.
    # 180s timeout: a long RAG answer plus a slow Groq call can exceed the
    #   default 30s and would otherwise be killed mid-request.
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 180"

    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- Secrets: Render asks for these on first deploy ---
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_HOST            # MongoDB Atlas SRV connection string
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD     # Gmail App Password
        sync: false
      - key: CORS_ALLOWED_ORIGINS    # e.g. https://your-app.vercel.app
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

      # --- Fixed production settings ---
      - key: DEBUG
        value: "False"
      - key: MONGODB_DB
        value: ragchatbot
      - key: EMBEDDING_BACKEND
        value: onnx                  # torch is not installed in production
      - key: EMBEDDING_ONNX_PROVIDER
        value: cpu                   # no GPU on Render

      # Must stay false here. With the preload on, the ONNX session is built in
      # a short-lived background thread at startup and then run() is called from
      # the upload thread, which deadlocks: uploads sit at "processing" forever,
      # with no exception, no error log and no failed status. Even a one-chunk
      # document never returns. Loading the model lazily means the session is
      # created and used on the same thread. Cost is ~20s on the first upload
      # after a restart, while it loads.
      - key: EMBEDDING_PRELOAD
        value: "false"

      - key: DEFAULT_FROM_EMAIL
        value: RAG Chatbot <no-reply@localhost>
